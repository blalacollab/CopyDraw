<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CopyDraw</title>
    <link rel="shortcut icon" href="./public/icon/render-icon.png" type="image/x-icon" />
    <link rel="stylesheet" href="./public/basic.css" />
    <link rel="stylesheet" href="./public/ui.css" />
  </head>
  <body>
    <!-- Top bar -->
    <div id="topbar">
      <button id="btn-undo" class="radius" title="撤销">👈</button>
      <button id="btn-redo" class="radius" title="重做">👉</button>
      <button id="btn-save" class="radius" title="保存">📦</button>
      <button id="btn-export" class="radius" title="导出">🎁</button>
      <select id="render-strategy-select">
        <option value="default">默认渲染</option>
      </select>
    </div>

    <!-- Left bar -->
    <div id="leftbar">
      <button id="edit-view" title="编辑/浏览模式">
        <img src=".\public\icon\arrow.png" alt="edit-view-icon" />
      </button>
      <button id="draw" title="绘制模式">
        <img src=".\public\icon\line_icon.ico" alt="draw-icon" />
      </button>
      <button id="text" title="文本模式">
        <img src=".\public\icon\text-icon.svg" alt="text-icon" />
      </button>
      <button id="render" title="渲染模式">
        <img src=".\public\icon\render-icon.png" alt="render-icon" />
      </button>
    </div>

    <div id="text-property-panel" class="text-property-panel">
      <div id="text-property-panel-title" class="text-property-panel-title">文字属性</div>
      <label class="text-property-row text-property-row-content">
        <span>内容</span>
        <textarea
          id="text-style-content"
          rows="3"
          placeholder="输入文本内容（支持换行）"
        >新文本</textarea>
      </label>
      <label class="text-property-row">
        <span>字体</span>
        <select id="text-style-font-family">
          <option value="sans-serif">无衬线</option>
          <option value="serif">衬线</option>
          <option value="monospace">等宽</option>
          <option value="'PingFang SC','Microsoft YaHei',sans-serif">苹方/雅黑</option>
          <option value="'KaiTi','STKaiti',serif">楷体</option>
        </select>
      </label>
      <label class="text-property-row">
        <span>字号</span>
        <input id="text-style-font-size" type="number" min="8" max="240" step="1" value="24" />
      </label>
      <label class="text-property-row">
        <span>颜色</span>
        <input id="text-style-color" type="color" value="#ffffff" />
      </label>
      <label class="text-property-row">
        <span>行高</span>
        <input id="text-style-line-height" type="number" min="0.8" max="3" step="0.1" value="1.25" />
      </label>
      <label class="text-property-row">
        <span>对齐</span>
        <select id="text-style-align">
          <option value="left">左对齐</option>
          <option value="center">居中</option>
          <option value="right">右对齐</option>
        </select>
      </label>
      <div id="text-style-actions" class="text-style-actions">
        <button id="text-style-cancel" type="button">取消</button>
        <button id="text-style-create" type="button">创建</button>
      </div>
    </div>

    <!-- Canvas area -->
    <div id="canvasContainer">
      <canvas id="backgroundCanvas"></canvas>
      <canvas id="dataCanvas"></canvas>
      <canvas id="temporaryCanvas"></canvas>
      <canvas id="selectCanvas"></canvas>
      <canvas id="mouseCanvas"></canvas>
    </div>

    <div id="info">xxxx</div>
    <script type="module" src="./src/index.js"></script>
  </body>
</html>
